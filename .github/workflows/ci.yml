name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create an ambiguous notice
        shell: bash
        run: |
          mkdir -p ci-fixture
          printf 'Applications close 03/04/2026 at 5:00 PM.\n' > ci-fixture/notice.md
      - name: Run the local composite action
        uses: ./
        with:
          path: ci-fixture
          fail-on-findings: "false"
